<style>
  :root {
    --ground:#f6f8f7; --surface:#ffffff; --surface-2:#eef2f0;
    --line:#dbe3e0; --ink:#15201d; --ink-2:#4d5a56; --ink-3:#8a9793;
    --marca:#00816c; --marca-eco:#e8f2ef;
    --serif:"Literata",Georgia,"Times New Roman",serif;
    --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:#0f1513; --surface:#161e1c; --surface-2:#1c2624;
      --line:#2a3835; --ink:#e7eeeb; --ink-2:#adbab6; --ink-3:#74827e;
      --marca:#46c2a8; --marca-eco:#12241f; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ground:#0f1513; --surface:#161e1c; --surface-2:#1c2624;
    --line:#2a3835; --ink:#e7eeeb; --ink-2:#adbab6; --ink-3:#74827e;
    --marca:#46c2a8; --marca-eco:#12241f; color-scheme: dark;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--ground); color:var(--ink);
    font-family:var(--serif); font-size:17px; line-height:1.68;
    -webkit-font-smoothing:antialiased; padding-inline:22px;
    min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .folha { max-width:420px; width:100%; text-align:center;
    display:flex; flex-direction:column; align-items:center; gap:22px;
    padding-block:60px; }
  .marca { display:flex; flex-direction:column; align-items:center; width:44px;
    color:var(--marca); line-height:1; }
  .cifrao { font-family:var(--sans); font-weight:600; font-size:40px; }
  .fio { width:2px; height:9px; background:currentColor; }
  .peso { width:17px; height:19px; background:currentColor;
    clip-path:polygon(50% 100%,0 30%,50% 0,100% 30%); }
  h1 { font-weight:500; font-size:30px; line-height:1.15; letter-spacing:-.02em;
    margin:0; text-wrap:balance; }
  p { margin:0; color:var(--ink-2); }
  .botao { font-family:var(--sans); font-size:16px; font-weight:600;
    text-decoration:none; color:#fff; background:var(--marca);
    padding:13px 26px; border-radius:8px; }
  .miuda { font-family:var(--sans); font-size:13.5px; color:var(--ink-3); }
  a { color:var(--marca); }
  :focus-visible { outline:2px solid var(--marca); outline-offset:3px; border-radius:2px; }
</style>
</head>
<body>
<div class="folha">

  <div class="marca" aria-hidden="true">
    <div class="cifrao">$</div>
    <div class="fio"></div>
    <div class="peso"></div>
  </div>

  <h1>Levando você para a App&nbsp;Store</h1>

  <a class="botao" href="https://apps.apple.com/br/app/id6810799444">Abrir na App Store</a>

  <p class="miuda">Se nada acontecer em alguns segundos, toque no botão acima.</p>

  <p class="miuda"><a href="./">Suporte</a> · <a href="privacidade.html">Privacidade</a> · <a href="termos.html">Termos</a></p>

</div>

<script>
  // Redundante com o <meta refresh>, e de propósito: em alguns navegadores o
  // meta demora. replace() em vez de href para não deixar esta página no
  // histórico — o botão "voltar" deve levar de onde a pessoa veio.
  location.replace("https://apps.apple.com/br/app/id6810799444");
</script>
</body>
</html>
